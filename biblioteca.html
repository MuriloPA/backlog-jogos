<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - PlayLog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topo">
        <div class="topo-esquerda">
            <span class="logo">PlayLog</span>
            <nav class="menu">
                <a href="biblioteca.html" aria-current="page">Biblioteca</a>
                <a href="sorteio.html">Sorteio</a>
                <a href="estatisticas.html">Estatísticas</a>
            </nav>
        </div>
        <div>
            <span id="usuario"></span>
            <button id="btn-sair" class="btn-secundario">Sair</button>
        </div>
    </header>

    <main class="conteudo">
        <details id="painel-form" class="painel-form">
            <summary id="resumo-form">Adicionar jogo</summary>

            <form id="form-jogo" class="formulario formulario-jogo" novalidate>
                <div class="campo campo-largo">
                    <label for="titulo">Título *</label>
                    <input type="text" id="titulo" name="titulo" maxlength="120">
                </div>

                <div class="campo campo-largo">
                    <span class="rotulo">Plataformas</span>
                    <div id="plataformas" class="chips"></div>
                    <div class="linha-outro">
                        <input type="text" id="plataforma-outro" maxlength="30" placeholder="Outra plataforma">
                        <button type="button" id="btn-plataforma-outro" class="btn-secundario">Adicionar</button>
                    </div>
                </div>

                <div class="campo campo-largo">
                    <span class="rotulo">Gêneros</span>
                    <div id="generos" class="chips"></div>
                    <div class="linha-outro">
                        <input type="text" id="genero-outro" maxlength="30" placeholder="Outro gênero">
                        <button type="button" id="btn-genero-outro" class="btn-secundario">Adicionar</button>
                    </div>
                </div>

                <div class="campo campo-largo">
                    <label for="capa_url">Link da capa</label>
                    <input type="url" id="capa_url" name="capa_url" maxlength="500" placeholder="https://...">
                </div>

                <div class="campo">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="fila">Na fila</option>
                        <option value="jogando">Jogando</option>
                        <option value="zerado">Zerado</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="nota">Nota</label>
                    <select id="nota" name="nota">
                        <option value="">Sem nota</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="horas_jogadas">Horas jogadas</label>
                    <input type="number" id="horas_jogadas" name="horas_jogadas" min="0" max="10000" step="0.5" value="0">
                </div>

                <div class="campo">
                    <label for="horas_estimadas">Horas para zerar</label>
                    <input type="number" id="horas_estimadas" name="horas_estimadas" min="0.5" max="10000" step="0.5">
                </div>

                <div class="campo campo-largo">
                    <label for="opiniao">Opinião</label>
                    <textarea id="opiniao" name="opiniao" rows="3" maxlength="500"></textarea>
                </div>

                <div class="campo campo-largo">
                    <div class="linha-botoes">
                        <button type="submit" id="btn-salvar" class="btn-principal">Salvar jogo</button>
                        <button type="button" id="btn-cancelar" class="btn-secundario" hidden>Cancelar edição</button>
                    </div>
                </div>
            </form>
        </details>

        <h2>Sua biblioteca</h2>

        <p id="carregando" class="vazio">Carregando seus jogos...</p>

        <div id="erro-carregar" hidden>
            <p id="texto-erro" class="vazio"></p>
            <button type="button" id="btn-recarregar" class="btn-secundario">Tentar novamente</button>
        </div>

        <section id="painel-filtros" class="filtros" hidden>
            <input type="search" id="busca" class="filtro-busca" placeholder="Buscar pelo título" maxlength="120" aria-label="Buscar pelo título">

            <select id="filtro-status" aria-label="Filtrar por status">
                <option value="">Todos os status</option>
                <option value="fila">Na fila</option>
                <option value="jogando">Jogando</option>
                <option value="zerado">Zerado</option>
            </select>

            <select id="filtro-plataforma" aria-label="Filtrar por plataforma">
                <option value="">Todas as plataformas</option>
            </select>

            <select id="filtro-genero" aria-label="Filtrar por gênero">
                <option value="">Todos os gêneros</option>
            </select>

            <select id="ordenacao" aria-label="Ordenar por">
                <option value="recentes">Mais recentes</option>
                <option value="antigos">Mais antigos</option>
                <option value="titulo">Título (A-Z)</option>
                <option value="nota">Maior nota</option>
                <option value="horas">Mais horas jogadas</option>
                <option value="curtos">Mais curtos primeiro</option>
            </select>

            <button type="button" id="btn-limpar" class="btn-secundario">Limpar</button>
        </section>

        <p id="contador" class="contador"></p>
        <p id="vazio" class="vazio" hidden>Você ainda não adicionou nenhum jogo.</p>
        <p id="sem-resultados" class="vazio" hidden>Nenhum jogo encontrado com esses filtros.</p>
        <section id="lista-jogos" class="grade"></section>
    </main>

    <script type="module" src="js/biblioteca.js"></script>
</body>
</html>
