<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Backlog Zero</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topo">
        <span class="logo">Backlog Zero</span>
        <div>
            <span id="usuario"></span>
            <button id="btn-sair" class="btn-secundario">Sair</button>
        </div>
    </header>

    <main class="conteudo">
        <details class="painel-form">
            <summary>Adicionar jogo</summary>

            <form id="form-jogo" class="formulario formulario-jogo" novalidate>
                <div class="campo campo-largo">
                    <label for="titulo">Título *</label>
                    <input type="text" id="titulo" name="titulo" maxlength="120">
                </div>

                <div class="campo">
                    <label for="plataforma">Plataforma</label>
                    <input type="text" id="plataforma" name="plataforma" maxlength="60" placeholder="PC, PS5, Switch...">
                </div>

                <div class="campo">
                    <label for="genero">Gênero</label>
                    <input type="text" id="genero" name="genero" maxlength="60" placeholder="RPG, Ação...">
                </div>

                <div class="campo campo-largo">
                    <label for="capa_url">Link da capa</label>
                    <input type="url" id="capa_url" name="capa_url" placeholder="https://...">
                </div>

                <div class="campo">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="fila">Na fila</option>
                        <option value="jogando">Jogando</option>
                        <option value="zerado">Zerado</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="nota">Nota</label>
                    <select id="nota" name="nota">
                        <option value="">Sem nota</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="horas_jogadas">Horas jogadas</label>
                    <input type="number" id="horas_jogadas" name="horas_jogadas" min="0" step="0.5" value="0">
                </div>

                <div class="campo">
                    <label for="horas_estimadas">Horas para zerar</label>
                    <input type="number" id="horas_estimadas" name="horas_estimadas" min="0.5" step="0.5">
                </div>

                <div class="campo campo-largo">
                    <label for="opiniao">Opinião</label>
                    <textarea id="opiniao" name="opiniao" rows="3" maxlength="500"></textarea>
                </div>

                <div class="campo campo-largo">
                    <button type="submit" id="btn-salvar" class="btn-principal">Salvar jogo</button>
                    <p id="mensagem-form" class="mensagem"></p>
                </div>
            </form>
        </details>

        <h2>Sua biblioteca</h2>
        <p id="mensagem-lista" class="mensagem"></p>
        <p id="vazio" class="vazio" hidden>Você ainda não adicionou nenhum jogo.</p>
        <section id="lista-jogos" class="grade"></section>
    </main>

    <script type="module" src="js/biblioteca.js"></script>
</body>
</html>
