<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatísticas - PlayLog</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/estatisticas.css">
</head>
<body>
    <header class="topo">
        <div class="topo-esquerda">
            <a class="logo" href="inicio.html" aria-label="PlayLog"><img src="assets/logo.svg" alt=""><span>Play<b>Log</b></span></a>
            <nav class="menu">
                <a href="inicio.html">Início</a>
                <a href="biblioteca.html">Biblioteca</a>
                <a href="sorteio.html">Sorteio</a>
                <a href="estatisticas.html" aria-current="page">Estatísticas</a>
            </nav>
        </div>
        <div>
            <span id="usuario"></span>
            <button id="btn-sair" class="btn-secundario">Sair</button>
        </div>
    </header>

    <main class="conteudo">
        <h2>Estatísticas</h2>

        <p id="carregando" class="vazio">Carregando suas estatísticas...</p>

        <div id="erro-carregar" hidden>
            <p id="texto-erro" class="vazio"></p>
            <button type="button" id="btn-recarregar" class="btn-secundario">Tentar novamente</button>
        </div>

        <p id="vazio-stats" class="vazio" hidden>Adicione jogos na biblioteca para ver suas estatísticas.</p>

        <div id="painel-stats" hidden>
            <section id="indicadores" class="indicadores"></section>

            <div class="graficos">
                <section class="grafico">
                    <h3>Jogos por status</h3>
                    <div id="grafico-status"></div>
                </section>

                <section class="grafico">
                    <h3>Jogos por gênero</h3>
                    <div id="grafico-generos"></div>
                </section>

                <section class="grafico">
                    <h3>Notas que você deu</h3>
                    <div id="grafico-notas"></div>
                </section>

                <section class="grafico">
                    <h3>Jogos por plataforma</h3>
                    <div id="grafico-plataformas"></div>
                </section>

                <section class="grafico">
                    <h3>Horas jogadas por gênero</h3>
                    <div id="grafico-horas-genero"></div>
                </section>

                <section class="grafico">
                    <h3>Jogos mais jogados</h3>
                    <div id="grafico-mais-jogados"></div>
                </section>
            </div>
        </div>
    </main>

    <script type="module" src="js/estatisticas-pagina.js"></script>
</body>
</html>
